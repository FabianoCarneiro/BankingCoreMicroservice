# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Test
      # run: dotnet test tests/Core.Tests/Core.Tests.csproj --no-build --verbosity normal
      run: dotnet test tests/Core.Tests/Core.Tests.csproj --filter 'FullyQualifiedName!~Integration'
  
  build:
    runs-on: ubuntu-latest
    needs: UnitTest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

  
  DeploySTG:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: deploy
      run: echo 'Deploy STG'
      
  
  IntegrationTest:
    runs-on: ubuntu-latest
    needs: DeploySTG
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: TestIntegration
      run: dotnet test tests/Core.Tests/Core.Tests.csproj --filter 'Integration&FullyQualifiedName!~ErrorSimulation'
