# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Pipeline
env:
  AZURE_WEBAPP_NAME: bankingcore    # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10'                 # set this to the .NET Core version to use

on:
  push:
  pull_request:

jobs:
  SAST:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@master
          
      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: auth
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      
      - name: Snyk Code test
        #run: snyk test --all-projects --org=aef0364d-d779-4277-a254-86c9a1273e6c
        run: snyk code test 
          
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif # --severity-threshold=high
          
      #- name: Upload result to GitHub Code Scanning
      #  uses: github/codeql-action/upload-sarif@v3
      #  with:
      #    sarif_file: snyk.sarif
  UnitTest:
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Test
      # run: dotnet test tests/Core.Tests/Core.Tests.csproj --no-build --verbosity normal
      run: dotnet test tests/Core.Tests/Core.Tests.csproj --filter 'FullyQualifiedName!~Integration' /p:CollectCoverage=true /p:CoverageFormat=opencover
  
  SonarAnalysis:
    runs-on: ubuntu-latest
    needs: UnitTest

    steps:
      - name: Analyze with SonarCloud

        # You can pin the exact commit or the version.
        # uses: SonarSource/sonarcloud-github-action@v2.2.0
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
        with:
          # Additional arguments for the SonarScanner CLI
          args:
            # Unique keys of your project and organization. You can find them in SonarCloud > Information (bottom-left menu)
            # mandatory
            -Dsonar.projectKey=caixaeconomica_bankingcore
            -Dsonar.organization=caixaeconomica
            -Dsonar.sources=src
            -Dsonar.tests=tests/Core.Tests/
            -Dsonar.verbose=true
            #-Dsonar.coverage.exclusions=**/*Tests.cs,**/bin/**,**/obj/**
            #-Dsonar.cpd.exclusions=**/*Tests.cs
            # Comma-separated paths to directories containing main source files.
            #-Dsonar.sources= # optional, default is project base directory
            # Comma-separated paths to directories containing test source files.
            #-Dsonar.tests= # optional. For more info about Code Coverage, please refer to https://docs.sonarcloud.io/enriching/test-coverage/overview/
            # Adds more detail to both client and server-side analysis logs, activating DEBUG mode for the scanner, and adding client-side environment variables and system properties to the server-side log of analysis report processing.
            #-Dsonar.verbose= # optional, default is false
          # When you need the analysis to take place in a directory other than the one from which it was launched, default is .
          projectBaseDir: .
  
  build:
    runs-on: ubuntu-latest
    needs:
      - SAST
      - UnitTest

    if: github.event_name == 'push'   
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
   
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: dotnet publish
      run: dotnet publish -c Release -o ./myapp

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: bankingcore
        path: ./myapp
    
    
  deployAzure:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: bankingcore

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  
  
  DeploySTG:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/Develop'

    steps:
    - uses: actions/checkout@v4
    - name: deploy
      run: echo 'Deploy STG'
      
  SmokeTesSTG:
    runs-on: ubuntu-latest
    needs: DeploySTG
    if: github.ref == 'refs/heads/Develop'
    
    steps:
    - uses: actions/checkout@v4
    - name: deploy
      run: echo 'Smoke Test STG'

  IntegrationTest:
    runs-on: ubuntu-latest
    needs: SmokeTesSTG
    if: github.ref == 'refs/heads/Develop'

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: TestIntegration
      run: dotnet test tests/Core.Tests/Core.Tests.csproj --filter 'Integration&FullyQualifiedName!~ErrorSimulation' --logger 'trx' --results-directory ./TestResults

  DeployPreProd:
    runs-on: ubuntu-latest
    needs: build
   
    if: github.ref == 'refs/heads/release'
    steps:
    - name: deploy
      run: echo 'Deploy PreProd'

  SmokeTestPreProd:
    runs-on: ubuntu-latest
    needs: DeployPreProd
    
    if: github.ref == 'refs/heads/release'
    steps:
    - name: deploy
      run: echo 'Smoke Test PreProd'

  FunctionalTest:
    runs-on: ubuntu-latest
    needs: SmokeTestPreProd

    if: github.ref == 'refs/heads/release'
    steps:
    - name: deploy
      run: echo 'FunctionalTest'

  DeployProd:
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main'
    steps:
    - name: deploy
      run: echo 'Deploy Prod'

  SmokeProd:
    runs-on: ubuntu-latest
    needs: DeployProd

    if: github.ref == 'refs/heads/main'
    steps:
    - name: deploy
      run: echo 'Smoke Test Prod'     
