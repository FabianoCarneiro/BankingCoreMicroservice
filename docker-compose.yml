version: '3.8'

services:
  # Customer Service Microservice
  customer-service:
    image: banking-core/customer-service:latest
    container_name: customer-service
    build:
      context: .
      dockerfile: src/Customer.Service/Customer.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_TYPE=sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/customer.db
    ports:
      - "5001:8080"
    volumes:
      - customer-data:/app/data
    networks:
      - banking-network

  # Banking Core Service
  banking-core-service:
    image: banking-core/banking-core-service:latest
    container_name: banking-core-service
    build:
      context: .
      dockerfile: src/Core.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_TYPE=sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/banking.db
      - CustomerService__BaseUrl=http://customer-service:8080
    ports:
      - "5002:8080"
    volumes:
      - banking-data:/app/data
    networks:
      - banking-network
    depends_on:
      - customer-service

volumes:
  customer-data:
    driver: local
  banking-data:
    driver: local

networks:
  banking-network:
    driver: bridge
